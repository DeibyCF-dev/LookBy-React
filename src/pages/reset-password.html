<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña — LookBy</title>
  
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>

  <header class="top-nav">
    <a href="../../index.html">
      <svg viewBox="0 0 340 90" height="38" role="img" aria-label="LookBy">
        <defs>
          <linearGradient id="logo-gold-reset" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D4AF37" />
            <stop offset="50%" stop-color="#FDECD4" />
            <stop offset="100%" stop-color="#C89D7C" />
          </linearGradient>
        </defs>
        <text x="50%" y="72" text-anchor="middle" font-family="'Pinyon Script', cursive" font-size="80" fill="url(#logo-gold-reset)">LookBy</text>
      </svg>
    </a>

    <div class="nav-actions">
      <button class="theme-toggle-btn" data-action="toggle-theme" title="Cambiar tema">
        <span class="theme-toggle-switch"></span>
        <span class="theme-icon">🌙</span>
      </button>
      <a href="login.html" class="btn btn-outline-gold btn-sm">← Iniciar Sesión</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card-wrapper">
      <div class="auth-header">
        <p class="eyebrow">Seguridad de cuenta</p>
        <h1 class="auth-title">Nueva Contraseña</h1>
        <p class="text-dim" style="font-size: 13.5px;">Ingresa y confirma tu nueva clave de acceso</p>
      </div>

      <div id="reset-success-box" class="card-luxury" style="display: none; text-align: center; padding: 2rem;">
        <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--status-success-bg); border: 1px solid var(--status-success-border); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: var(--status-success-text); font-size: 1.5rem;">
          ✓
        </div>
        <h3 style="font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 0.5rem;">¡Contraseña Actualizada!</h3>
        <p style="color: var(--fg-muted); font-size: 13px; margin-bottom: 1.5rem;">Tu clave ha sido restablecida exitosamente. Ahora puedes ingresar con tus nuevas credenciales.</p>
        <a href="login.html" class="btn btn-gold w-full btn-lg">Iniciar Sesión Ahora →</a>
      </div>

      <div id="reset-form-box">
        <form id="reset-password-form" class="card-luxury">
          <div class="form-group">
            <label class="form-label" for="new-password">Nueva Contraseña</label>
            <input type="password" id="new-password" class="input-base" placeholder="Mínimo 6 caracteres" required autofocus />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-new-password">Confirmar Contraseña</label>
            <input type="password" id="confirm-new-password" class="input-base" placeholder="••••••••" required />
          </div>

          <div id="reset-error" class="badge badge-danger" style="display: none; width: 100%; padding: 0.65rem 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; text-transform: none; font-size: 12px;"></div>

          <button type="submit" class="btn btn-gold w-full btn-lg">Guardar Nueva Contraseña</button>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="../js/theme.js"></script>
  <script type="module">
    import { initAuthPage } from '../js/pages/auth.js';
    initAuthPage();
  </script>
</body>
</html>
